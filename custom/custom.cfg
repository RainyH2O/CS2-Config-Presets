// Alias
alias debug "exec debug"
alias exg "exec exg/exg"
alias fys "exec fys/fys"
alias zed "exec zed/zed"

// Chatwheel
exec chatwheel

// ConVars
cl_allow_multi_input_binds true
cl_hud_telemetry_net_detailed 2
cl_hud_telemetry_net_quality_graph_show 1
cl_hud_telemetry_ping_show 2
cl_hud_telemetry_serverrecvmargin_graph_show 1
cl_scoreboard_mouse_enable_binding +attack2
cl_showpos 1
