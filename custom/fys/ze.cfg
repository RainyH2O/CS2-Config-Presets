// Cmds
bind F1 ms_if
bind ENTER ms_tp
bind HOME ms_ztele

// Hide
alias hide_range hide_range1
alias hide_range1 "ms_hide -1; alias hide_range hide_range2"
alias hide_range2 "ms_hide 0; alias hide_range hide_range3"
alias hide_range3 "ms_hide 150; alias hide_range hide_range1"
bind DEL hide_range

// Items
bind F5 ms_mp5
bind F7 ms_mp7
bind F9 ms_mp9
bind F10 ms_mac10

bind - ms_kevlar
bind = ms_health

bind i ms_fire
bind o ms_hole
bind p ms_push

bind h ms_nade
bind k ms_ices

bind n ms_bizon

bind UPARROW ms_negev
bind DOWNARROW ms_m249
bind LEFTARROW ms_m4a1
bind RIGHTARROW ms_ak47
